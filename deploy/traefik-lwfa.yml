# Traefik dynamic config for lwfa. Template: edit the two placeholders.
#
#   lwfa.example.com  ->  the hostname you will open on the tablet
#   192.0.2.10        ->  the LAN address of the machine running lwfa
#
# 192.0.2.x is TEST-NET-1, reserved for documentation, so an unedited copy of
# this file fails visibly rather than quietly routing somewhere real.
#
# Drop the edited file in the Traefik host's dynamic directory (usually
# /etc/traefik/dynamic/). The file provider watches it, so no restart.
#
# Keep your edited copy in deploy/local/, which is gitignored. This file is the
# template and is meant to stay generic.
#
# # Why there is only one router
#
# The engine serves the page and its own socket on one port: a WebSocket
# upgrade is the protocol, everything else is a file from the built shell. So
# one hostname goes to one backend and there is nothing to split.
#
# This used to be two routers with a `/engine` path rule and an explicit
# priority, because the page and the socket were two different servers on two
# ports. Traefik forwards WebSocket upgrades on its own, with no annotation
# needed, so nothing was gained by keeping the split once the engine served
# both.
#
# # Port
#
# 6733 is the engine, serving both. During development Vite serves the page on
# that port instead and proxies the socket back to the engine on 6734, so this
# file is unchanged either way.

http:
  routers:
    lwfa:
      rule: "Host(`lwfa.example.com`)"
      entryPoints:
        - websecure
      service: lwfa
      tls: {}

  services:
    lwfa:
      loadBalancer:
        servers:
          - url: "http://192.0.2.10:6733"
        # A session is long-lived and streams continuously, so the response
        # must not be buffered on its way out. Traefik streams by default;
        # this is here to say that it is deliberate rather than unconsidered.
        responseForwarding:
          flushInterval: "1ms"
