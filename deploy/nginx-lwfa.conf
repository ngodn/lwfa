# nginx config for lwfa. Template: edit the placeholders.
#
#   lwfa.example.com  ->  the hostname you will open on the tablet
#   192.0.2.10        ->  the LAN address of the machine running lwfa
#   /etc/nginx/tls/   ->  wherever your certificate and key live
#
# 192.0.2.x is TEST-NET-1, reserved for documentation, so an unedited copy of
# this file fails visibly rather than quietly routing somewhere real.
#
# Keep your edited copy in deploy/local/, which is gitignored. This file is the
# template and is meant to stay generic.
#
# # Why a proxy at all
#
# HTTPS is not only transport security here. WebCodecs requires a secure
# context, so without TLS the browser refuses hardware decode and every window
# falls back to JPEG. The proxy is what turns the stream from JPEG into
# hardware H.264/HEVC, which is why "it works but looks bad" is almost always
# a missing certificate rather than a bandwidth problem.
#
# # Why there is only one backend
#
# The engine serves the page and its own socket on one port: a WebSocket
# upgrade is the protocol, everything else is a file. So this is an ordinary
# reverse proxy with nothing to split. It used to need a second backend and a
# path rule, which existed only because Vite served the page during
# development and that arrangement leaked into production.
#
# # A certificate for a LAN address
#
# There is no public CA for 192.168.x.x. Either point a real hostname at the
# LAN address and use a DNS-01 certificate, or generate a self-signed one and
# trust it on the tablet once:
#
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -keyout lwfa.key -out lwfa.crt \
#     -subj "/CN=lwfa.example.com" \
#     -addext "subjectAltName=DNS:lwfa.example.com,IP:192.0.2.10"
#
# On iOS a self-signed certificate must be installed *and* enabled under
# Settings > General > About > Certificate Trust Settings, which is a separate
# step people miss.

# WebSocket upgrades: pass Connection through only when the client asked for
# one, so ordinary page requests still get a keep-alive connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;

    server_name lwfa.example.com;

    ssl_certificate     /etc/nginx/tls/lwfa.crt;
    ssl_certificate_key /etc/nginx/tls/lwfa.key;

    # Video frames, not documents. A cap here truncates a stream mid-flight.
    client_max_body_size 0;

    location / {
        proxy_pass http://192.0.2.10:6733;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Buffering is the enemy of a live stream: it adds latency and hides
        # the socket backpressure the engine's adaptive bitrate reads as the
        # network's own voice. Off in both directions.
        proxy_buffering  off;
        proxy_request_buffering off;

        # A session outlives any sensible request timeout. The engine pings
        # idle sockets itself and reaps the ones that stop answering, so a
        # long timeout here costs nothing and a short one drops live sessions.
        proxy_read_timeout  1d;
        proxy_send_timeout  1d;
    }
}
