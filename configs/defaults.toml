# lwfa defaults.
#
# One legible place for the settings that were previously spread across a dozen
# `const` declarations in Rust and a couple of object literals in TypeScript.
#
# Every value here also has a built-in fallback in the code, so a missing key,
# a missing section, or a missing file are all fine. That is deliberate: the
# engine must still start when this file is broken, because the thing you fix
# it from may well be running inside it.
#
# Precedence, highest first:
#
#   1. environment variables   LWFA_SHELL_ADDR=0.0.0.0:6734 cargo run
#   2. .env                    gitignored, machine-local
#   3. this file               committed, shared
#   4. built-in defaults       in the code
#
# NO SECRETS HERE. This file is committed. `AUTH_PASS` lives in `.env`, which
# is gitignored and mode 600. See the README.

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
[net]
# Where the engine listens. One port serves both the page and the protocol.
#
# A WebSocket upgrade is the protocol; every other request is a file from the
# built shell. They were two ports while two different programs served them,
# and once the engine served both that cost a reverse proxy with a path split,
# a second firewall hole and an extra question at install time, for nothing.
#
# Loopback by default, because this socket injects keystrokes and spawns
# processes, so opening it to the network is a decision to make on purpose.
# Use "0.0.0.0:6733" to reach it from a tablet, and read the security note in
# the README first: there is no TLS yet.
shell_addr = "127.0.0.1:6733"

# Where the built shell lives. Empty means look in the usual places:
# packages/shell/dist above the binary or the working directory, then
# share/lwfa/shell beside an installed binary, then the system prefixes.
#
# Leave it empty. This exists for an installation that puts the page somewhere
# unusual, not for everyday use.
#
# Nothing breaks if it is not found: the engine still serves the protocol, and
# during development Vite serves the page and proxies the socket back here.
shell_dir = ""

# ---------------------------------------------------------------------------
# How lwfa's own window is placed in a host compositor
# ---------------------------------------------------------------------------
#
# Only the nested backend uses this: lwfa runs as an ordinary window inside
# Hyprland (or whatever else) while it is being developed. The TTY backend
# owns the display outright and ignores this section entirely.
[host]
# A workspace of its own, so lwfa never lands on top of what you are doing.
workspace = 10

# Full-screen on that workspace. A compositor showing a scrollable strip wants
# the whole output; in a small floating window the strip is not usable.
fullscreen = true

# Place it *without* switching your view to that workspace. Without this,
# starting the engine yanks your display over to it. See `scripts/dev-nested.sh`.
silent = true

# ---------------------------------------------------------------------------
# The nested window itself
# ---------------------------------------------------------------------------
[window]
# The app id lwfa reports to the host, and what a host window rule matches on.
# Changing this means updating the rules in your compositor config too.
app_id = "lwfa"
title = "lwfa"

# Size before anything full-screens it. Only ever seen for a frame or two when
# `host.fullscreen` is set.
width = 1280
height = 800

# Behind the strip. Slightly lighter than black so the gaps between columns are
# visible and the strip reads as a strip. Linear RGBA, 0..1.
backdrop = [0.047, 0.051, 0.063, 1.0]

# Whether the nested host window shows the session.
#
# Turn this off when the window is parked on a hidden workspace and the
# session is only ever watched remotely. It is more than a saving: presenting
# to a window the host has hidden eventually blocks inside the driver waiting
# for a buffer the host will never return, and that freeze takes the whole
# engine with it, remote clients included. The window then just shows its
# backdrop if anyone ever looks. `LWFA_NO_PREVIEW=1` forces it off too.
preview = true

# ---------------------------------------------------------------------------
# Session
# ---------------------------------------------------------------------------
[session]
# Spawned by Alt+Return, and on startup unless `autostart_terminal` is false.
#
# If this is not installed the engine falls back to whatever is: foot, kitty,
# ghostty, wezterm, gnome-terminal, konsole, xfce4-terminal, then xterm. That
# is not politeness, it is the difference between a first run that works and
# one that shows an empty desktop with the reason only in the log.
#
# The fallback is reported once at startup, so a machine quietly using
# something other than what is written here says so.
terminal = "alacritty"

# Open a terminal at startup, so a fresh session has something in it.
autostart_terminal = true

# Run Xwayland, so X11 clients work: Steam, anything under Proton, older
# GTK2/Qt4 programs, Electron builds without the ozone flags. Costs ~30MB and
# one child process. Without it those do not degrade, they fail to start.
xwayland = true

# ---------------------------------------------------------------------------
# Streaming to a remote shell
# ---------------------------------------------------------------------------
[stream]
# Captured windows go to the encoder without touching system RAM: the rendered
# texture is handed to CUDA and NVENC reads it in place. Needs the NVIDIA
# driver; on any failure the engine falls back to read-back capture on its
# own, so turning this off only forces the fallback for debugging.
gpu_direct = true

# Concurrent NVENC sessions. Eight is the limit on consumer NVIDIA parts; the
# ninth window degrades to JPEG rather than failing. Raise it on a card that
# allows more, and see `crates/lwfa-engine/src/encode.rs`.
max_h264_sessions = 8

# Keyframe interval, in frames. Long, because the shell asks for a keyframe
# explicitly whenever it needs one, so periodic ones are pure overhead.
gop = 120

# Quality of the JPEG fallback, 1-100. Used for clients with no H.264 decoder,
# which in practice means any browser on a page served over plain HTTP:
# WebCodecs requires a secure context.
jpeg_quality = 70

# How many captured frames may wait for the encoder thread. Small on purpose.
# Dropping a frame under load beats building an unbounded queue of stale ones.
encoder_queue_depth = 2

# How many encoded frames may be queued for the socket before capture stops.
# This is the backpressure that keeps a slow link from costing GPU read-back.
max_frames_in_flight = 4

# ---------------------------------------------------------------------------
# Render loop
# ---------------------------------------------------------------------------
[render]
# How often to check whether the on-screen loop has stalled. Roughly 60Hz.
tick_ms = 16

# How long the host may go without giving us a frame callback before the
# streaming path is driven from a timer instead.
#
# A host stops sending frame callbacks the moment lwfa's window is not visible,
# which for an ordinary nested compositor is correct. It is wrong here: the
# whole point is that the session stays usable from a tablet while nobody is
# looking at the host screen. Three frames at 60Hz.
redraw_stall_ms = 50

# Shortest gap between two presentations to the host's display.
#
# This is a safety interlock, not a performance knob. A host drives a nested
# compositor through frame callbacks, so a real request cannot arrive sooner
# than one display interval: 16ms at 60Hz, 5.5ms at 180Hz. Anything faster came
# from somewhere else, in practice a burst of configures when a window rule
# places or full-screens the window.
#
# Presenting on those hangs the compositor outright, because the host has not
# released the previous buffer and never will for a surface it has not shown, so
# the call blocks on the event loop thread forever. 4ms is below any real
# display's interval, so nothing genuine is ever skipped.
min_present_ms = 4

# ---------------------------------------------------------------------------
# Layout
# ---------------------------------------------------------------------------
#
# Read by the *shell*, which owns layout policy. The engine never reads this
# section; it only reconciles what the shell tells it. See docs/architecture.md.
[layout]
# Gap between columns, between stacked windows, and at the output edge.
gap = 12

# Column widths as a fraction of the output, cycled by Alt+4.
#
# 0.9 is the widest that still shows the strip: the sliver of the neighbour at
# the edge is what tells you there is more in that direction. A column at
# exactly 100% looks like a maximised window, and then scrolling sideways is a
# surprise.
#
# 0.99 is deliberately past that line, for the cases where the surprise is
# worth it: reading, or watching something, where you want the whole viewport
# and not a mode. It is not fullscreen, which drops every other window from the
# layout and stops capturing them. This is still a column on a strip, so the
# gaps, the rounded corners and the neighbours are all still there, one flick
# away. Anyone who wants the neighbour visible has 0.9 one tap to the left.
width_presets = [0.3333333333333333, 0.5, 0.6666666666666667, 0.9, 0.99]

# Which of those a new column gets. An index into `width_presets`.
#
# The widest, so an application you open gets essentially the whole viewport and
# is immediately usable. Anything smaller is a decision the user can make with
# one tap once they want two things side by side, whereas a window that opens
# too small has to be fixed before it is useful.
default_width = 3

# Which way the strip runs: "auto", "horizontal" or "vertical".
#
# Auto follows the viewport's long axis, which is almost always what you want:
# a row of columns on a monitor, a stack of rows on a phone held upright.
# Pin it only if you specifically want one behaviour regardless of rotation.
orientation = "auto"

# Keep the focused column in the middle of the viewport.
#
# Focus then always lands in the same place, so moving along the strip is a
# predictable motion rather than a scroll you have to read, and both neighbours
# peek in at the edges. It matters most on a tablet, where there is no keyboard
# to tell you where you are. Set false for the minimal-scroll behaviour, which
# wastes no motion on a wide display where several columns already fit.
centre_focused = true

# Floor in logical pixels, so a preset cannot make a column unusably narrow on
# a small viewport. This is what stops ⅓ of a phone screen being 120px.
min_width = 240

# ---------------------------------------------------------------------------
# Motion
# ---------------------------------------------------------------------------
#
# One spring, used by both halves of the project: the engine integrates it for
# the physical display (`crates/lwfa-engine/src/layout.rs`) and the browser
# integrates it for a remote shell (`packages/shell/src/lib/motion.ts`). Both
# use `lwfa-spring`, which exists in Rust and TypeScript precisely so the same
# move looks the same wherever you are watching it from.
#
# Motion's parameterisation: a mass on a spring with a damper.
[animation]
# How hard the spring pulls. Higher is faster and more urgent.
#
# High, because the damping below is above critical and an overdamped spring
# crawls to a stop. Stiffness is what buys that back: at 240 the same
# non-bouncing move took over a second to settle, which reads as sluggish
# rather than smooth. `test/motion.test.ts` holds both ends of this.
stiffness = 1000

# How much the motion is resisted.
#
# The critical value is 2 * sqrt(stiffness * mass), about 63.2 here, and this is
# deliberately just above it. Below critical a window overshoots its position
# and springs back. At exactly critical it stops dead from rest, but a spring
# redirected mid-flight carries its velocity into the new one and can still
# pass the target once. Slightly overdamped removes both, at no visible cost.
#
# Drop this below 63 if you actually want overshoot.
damping = 66

mass = 1.0

# Anyone who has asked their operating system for reduced motion gets none of
# this regardless: windows move instantly. That preference is not overridden.

# ---------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------
#
# Nothing is captured until a connected client asks for it, and asking is a
# per-device switch in the shell rather than a setting here. This section only
# says *what* to capture when someone does.
[audio]
# Which PulseAudio/PipeWire source to record. Unset means the default sink's
# monitor: whatever you would hear sitting at this machine.
#
# That includes sound from programs which are not running in lwfa, because
# there is no reliable link from a Wayland window to the audio node its client
# writes to. If that matters, make a null sink, route only what you want into
# it, and name its monitor here:
#
#   pactl load-module module-null-sink sink_name=lwfa
#   device = "lwfa.monitor"
#
# device = "alsa_output.pci-0000_00_1f.3.analog-stereo.monitor"

[gamepad]
# Create the virtual controller at engine startup and keep it forever.
#
# Proton runs games in a container with no udev, and controller hotplug
# detection there is unreliable: a pad that appears after a game launches is
# often never seen, and lwfa's pad normally appears when the on-screen
# controller is toggled, which is usually after. A persistent pad exists
# before every launch, like real hardware. The cost is that the machine
# always advertises one idle controller.
persistent = true
