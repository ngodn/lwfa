[package]
name = "lwfa-engine"
version = "1.2.0"
description = "The lwfa compositor: Wayland protocol, layout, and rendering"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lwfa-spring = { path = "../lwfa-spring" }
lwfa-proto = { path = "../lwfa-proto" }

# Started from Smithay's own `smallvil` example at the v0.7.0 tag, the minimum
# for a nested compositor. `backend_winit` brings the GL renderer with it.
# DRM/KMS and libinput arrive with the TTY backend later.
#
# `xwayland` is what lets X11 clients in: Steam, anything under Proton, older
# GTK2/Qt4 programs, and Electron builds without the ozone flag. It pulls in
# x11rb and runs a real Xwayland server as a child process.
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }

# Talking to the *host* compositor, as a client, so the desktop outside lwfa
# shares one clipboard with the session inside it. All four already arrive
# through winit; naming them here only turns on the client halves and the
# staging protocols. See `hostclip.rs`.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop-wayland-source = "0.4"

# The same calloop smithay re-exports, named here only to turn on `signals`.
# Features are additive, so this enables it on smithay's copy too. Without it
# SIGTERM kills the process outright and nothing in the loop is ever dropped;
# see `init_signals` in main.rs.
calloop = { version = "0.14", features = ["signals"] }

# Blocking WebSocket server for the shell protocol, run on its own thread and
# bridged into calloop. No async runtime: one socket does not justify it.
tungstenite = "0.30.0"

# Only the two codecs lwfa actually uses. PNG for the debug capture dump
# (lossless, so a wrong-channel-order bug is visible rather than smoothed away)
# and JPEG for the wire. Hardware H.264 replaces JPEG on the wire later; see
# crates/lwfa-engine/src/capture.rs.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

# Hardware H.264 via the system ffmpeg's h264_nvenc. Chosen over
# nvidia-video-codec-sdk because that crate's cudarc dependency hard-panics on
# CUDA 13.3, which is what this machine has. See crates/lwfa-engine/src/encode.rs.
#
# The major version tracks the system ffmpeg's, because the bindings are
# generated from whatever headers are installed. Arch moved to ffmpeg 9 on
# 2026-08-16 and the 8.x crate stopped compiling against it: constants it names
# (AV_CODEC_ID_V410 and friends) are gone, and `AVCodec` no longer has
# `supported_framerates`. The failure hid for three days behind cargo's cache,
# so a release build kept working until something invalidated it.
ffmpeg-next = "9.0.0"
serde_json = "1.0.151"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
argon2 = { version = "0.5.3", features = ["std", "password-hash"] }
input-linux = "0.7.1"
libc = "0.2.189"
rustix = { version = "1.1", features = ["process", "event", "net"] }
opus = "0.3.1"
x11rb = "0.13"
# The file-chooser portal backend: a D-Bus service on a private session bus.
# zbus spawns a task per method call, which is what lets a dialog stay open
# for minutes without starving the Settings interface next to it.
zbus = "5"
# Streaming SHA-256 of uploads, so "ok" means verified rather than hoped.
sha2 = "0.11.0"
# One oneshot per open dialog, carrying the answer from the compositor
# thread back into the portal's executor.
futures-channel = "0.3.33"

[lints]
workspace = true
