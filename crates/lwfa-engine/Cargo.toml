[package]
name = "lwfa-engine"
version = "0.1.0"
description = "The lwfa compositor: Wayland protocol, layout, and rendering"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lwfa-spring = { path = "../lwfa-spring" }
lwfa-proto = { path = "../lwfa-proto" }

# Feature set matches Smithay's own `smallvil` example at the v0.7.0 tag, which
# is the minimum for a nested compositor. `backend_winit` brings the GL
# renderer with it. DRM/KMS and libinput arrive with the TTY backend later.
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
] }

# Blocking WebSocket server for the shell protocol, run on its own thread and
# bridged into calloop. No async runtime: one socket does not justify it.
tungstenite = "0.30.0"

# Only the two codecs lwfa actually uses. PNG for the debug capture dump
# (lossless, so a wrong-channel-order bug is visible rather than smoothed away)
# and JPEG for the wire. Hardware H.264 replaces JPEG on the wire later; see
# crates/lwfa-engine/src/capture.rs.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde_json = "1.0.151"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
