<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>lwfa</title>
    <meta name="description" content="Literally work from anywhere" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/png/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/png/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Ink, from the brand. Colours the browser chrome around the page and the
      status bar once the shell is on a home screen, so a desktop does not sit
      inside a white frame on a phone.
    -->
    <meta name="theme-color" content="#0C0D10" />

    <!--
      Full screen from the home screen. Every row of browser furniture is a row
      of desktop lost, which on a tablet is the difference between a window
      being usable and not.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="lwfa" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
